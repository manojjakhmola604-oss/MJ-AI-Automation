name: Build MJ AI Automation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          unzip -q MJ-AI-Automation-MVP.zip
          echo "Files extracted:"
          find . -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find . -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix XML
        run: |
          perl -0pi -e 's/&(?!(?:amp|lt|gt|quot|apos);)/&amp;/g' "$PROJECT_DIR/app/src/main/res/layout/activity_main.xml"

      - name: Remove sensitive permissions and notification listener
        run: |
          perl -0pi -e 's#\s*<uses-permission android:name="android\.permission\.READ_PHONE_STATE"\s*/>##g; s#\s*<uses-permission android:name="android\.permission\.CALL_PHONE"\s*/>##g; s#\s*<service android:name="\.SecurityNotificationListener".*?</service>##gs' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Final Manifest:"
          cat "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        run: |
          find . -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MJ-AI-Automation-APK
          path: "**/build/outputs/apk/debug/*.apk"
